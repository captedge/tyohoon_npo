name: typhoon_ship_tracker
description: Typhoon course and ship position tracker (offline-first, desktop and mobile).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # CSVファイル選択ダイアログ（航海計画CSVインポート用、Windowsデスクトップ対応）
  file_picker: ^8.1.2
  # 登録済み情報（Passage Plan・台風情報・船名・UI設定）を次回起動時に読み込むための永続化
  # （2026-07-27追加）。2026-08にexe相対のUserDataフォルダへの直接ファイル保存へ切替済み
  # （lib/utils/portable_storage_dir.dart・docs/devlog-portable-data-dir.md参照）のため、
  # 現在はこのパッケージ自体は使わず、旧保存先からの一度きりの移行読み込み
  # （lib/utils/app_state_storage.dart の load()）にのみ残している。
  shared_preferences: ^2.3.2
  # 取り込んだPassage Plan CSVを蓄積するライブラリ保存先フォルダを取得するため
  # （2026-07-27追加、Select CSV/Edit CSV機能）。Windows実装（path_provider_windows）は
  # 既にshared_preferences_windows/file_picker経由でこのプロジェクトに間接的に
  # 解決済み（pubspec.lock参照）のため、新規のネイティブビルド要件は発生しない見込み。
  path_provider: ^2.1.4
  # 気象庁「防災情報XML」（VPTW60電文）のパース用（2026-07-28追加）。純Dart実装の
  # XMLパーサーでネイティブコードを含まないため、file_picker導入時のsymlink要件
  # のようなWindowsデスクトップビルド特有の追加設定は不要（docs/operation-rules.md
  # 完了報告前チェック項目7の確認事項）。
  xml: ^7.0.1
  # About画面のバージョン表示用（2026-08-04追加）。Windows実装はwin32（純Dart FFI、
  # システムDLL呼び出しのみ）に依存しており、file_picker導入時のようなsymlink/
  # Visual Studio C++ワークロード要件のある独自ネイティブプラグインではないことを
  # pub.devの依存関係一覧（win32/ffi/http/path/clock/meta、いずれも純Dart）で確認
  # 済み（docs/operation-rules.md完了報告前チェック項目7の確認事項）。バージョンは
  # 最新の10.1.0ではなく9.0.1を指定：10系はDart SDK 3.10/3.11以上が必要だが、この
  # プロジェクトの`environment.sdk`は">=3.3.0"としか宣言しておらず実機のFlutter/Dart
  # バージョンが不明なため、`environment.sdk`と同じ3.3を要求する9.0.1（2026-03-30公開、
  # 現行メンテ範囲内）を選び、`flutter pub get`が未知のSDKバージョン不一致で失敗する
  # リスクを避けた。
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/coastline/
    - assets/ship_01.png
    - assets/ship_02.png
    - assets/ship_03.png
    - assets/ship_04.png
    - assets/ship_05.png
    - assets/ship_06.png
    - assets/ship_07.png
    - assets/ship_08.png
    - assets/ship_09.png
    - assets/ship_10.png
    - assets/typhoon_icon01.png
    # フォントのライセンステキスト（2026-08-04追加）：About画面の
    # 「Open-Source Licenses」一覧にComic Mono/Zen Maru Gothicのライセンスも
    # 表示するため、main.dartのLicenseRegistry.addLicenseから
    # rootBundle.loadStringで読み込む。`fonts:`セクションでの登録はttf自体を
    # フォントアセットとして扱うだけで、この.txt自体は別途assetsに列挙しない
    # と実行時に読み込めない（バンドルされない）ため、ここに明示的に追加。
    - assets/fonts/ComicMono-LICENSE.txt
    - assets/fonts/ZenMaruGothic-OFL.txt
  # アプリ全体のフォント（2026-08-04追加、ユーザー指定）：日本語＝Zen Maru
  # Gothic・英数字＝Comic Mono。両フォントとも1ウェイトのみのファイル
  # （comic_mono_bold.ttf＝bold相当、zen_maru_gothic_medium.ttf＝medium相当）
  # しか用意されていないため、そのウェイトを唯一の定義として登録している
  # （太字・通常字それぞれ別ファイルを持たせる一般的な複数ウェイト構成ではな
  # い）。実際の適用（fontFamily/fontFamilyFallbackの設定）はlib/main.dart
  # 参照。ライセンス：Comic MonoはMIT（assets/fonts/ComicMono-LICENSE.txt）、
  # Zen Maru GothicはSIL OFL 1.1（assets/fonts/ZenMaruGothic-OFL.txt）、いずれ
  # もアプリへの同梱可。両ファイルとも上記assetsにも列挙済み（About画面の
  # Open-Source Licensesページに表示するため、main.dart参照）。
  fonts:
    - family: Comic Mono
      fonts:
        - asset: assets/fonts/comic_mono_bold.ttf
          weight: 700
    - family: Zen Maru Gothic
      fonts:
        - asset: assets/fonts/zen_maru_gothic_medium.ttf
          weight: 500
