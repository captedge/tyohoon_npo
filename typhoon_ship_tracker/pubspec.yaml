name: typhoon_ship_tracker
description: Typhoon course and ship position tracker (offline-first, desktop and mobile).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # CSVファイル選択ダイアログ（航海計画CSVインポート用、Windowsデスクトップ対応）
  file_picker: ^8.1.2
  # 登録済み情報（Passage Plan・台風情報・船名・UI設定）を次回起動時に読み込むための永続化
  # （2026-07-27追加）。Windows実装（shared_preferences_windows）はJSONファイルへの
  # プレーンなDart file I/Oのみで追加のネイティブビルドは不要。symlinkサポート
  # （Developer Mode）はfile_picker追加時に既に有効化済みのため追加要件なし
  # （docs/flutter-windows-env-notes.md 既知の癖8参照）。
  shared_preferences: ^2.3.2
  # 取り込んだPassage Plan CSVを蓄積するライブラリ保存先フォルダを取得するため
  # （2026-07-27追加、Select CSV/Edit CSV機能）。Windows実装（path_provider_windows）は
  # 既にshared_preferences_windows/file_picker経由でこのプロジェクトに間接的に
  # 解決済み（pubspec.lock参照）のため、新規のネイティブビルド要件は発生しない見込み。
  path_provider: ^2.1.4
  # 気象庁「防災情報XML」（VPTW60電文）のパース用（2026-07-28追加）。純Dart実装の
  # XMLパーサーでネイティブコードを含まないため、file_picker導入時のsymlink要件
  # のようなWindowsデスクトップビルド特有の追加設定は不要（docs/operation-rules.md
  # 完了報告前チェック項目7の確認事項）。
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/coastline/
    - assets/ship_icon01.png
    - assets/typhoon_icon01.png
